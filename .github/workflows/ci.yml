name: ci

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.13"
      # Pin the linter. `uvx ruff` tracks latest, and 0.16 widened the default rules.
      - run: uvx ruff@0.16.8 check ingestion orchestration scripts
